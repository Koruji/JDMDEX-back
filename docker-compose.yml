services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jdmdex-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Server
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      
      # MariaDB (connect to external DB or use mariadb service below)
      - MYSQL_HOST=${MYSQL_HOST:-mariadb}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-jdmdex}
      - MYSQL_USER=${MYSQL_USER:-jdmdex_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      
      # JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      
      # Bunny CDN
      - BUNNY_API_KEY=${BUNNY_API_KEY}
      - BUNNY_STORAGE_ZONE=${BUNNY_STORAGE_ZONE:-jdmdex}
      - BUNNY_PULL_ZONE=${BUNNY_PULL_ZONE:-jdmdex-cdn.loocist23.fr}
      
      # File Uploads
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-10485760}
      - UPLOAD_DIR=${UPLOAD_DIR:-./uploads}
      
      # Logging
      - LOG_DIR=${LOG_DIR:-./logs}
      - LOG_FILE=${LOG_FILE:-./logs/api-errors.log}
      - LOG_LEVEL=${LOG_LEVEL:-error}
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - jdmdex-network
    depends_on:
      mariadb:
        condition: service_healthy

  # Optional: MariaDB service (uncomment if you want DB in Docker)
  mariadb:
    image: mariadb:10.11
    container_name: jdmdex-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jdmdex}
      MYSQL_USER: ${MYSQL_USER:-jdmdex_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-jdmdex_pass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jdmdex-network
networks:
 jdmdex-network:
   driver: bridge

volumes:
  mariadb_data:
